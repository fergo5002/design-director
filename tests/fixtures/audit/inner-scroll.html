<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;height:100%;overflow:hidden;font:18px/1.6 system-ui}
#app{height:100%;overflow-y:auto}
.s{height:900px;padding:24px;border-bottom:1px solid #ddd}
.bad{color:#bbb;background:#fff}
.jank{width:200px;height:40px;background:#c00}
</style></head><body><div id="app">
<section class="s"><h1>Top</h1><p>Fine copy.</p></section>
<section class="s"><p class="bad">Pale grey text on white, far below the first screen, which fails contrast.</p></section>
<section class="s" id="heavy"><div class="jank" id="j"></div></section>
<section class="s"><p>End.</p></section>
</div><script>
document.getElementById('app').addEventListener('scroll',()=>{const t=performance.now();while(performance.now()-t<120){} document.getElementById('j').style.width=(200+Math.random()*50)+'px';});
</script></body></html>
