<html lang="en">
<head>
<meta charset="utf-8">

<title>Clipped</title>
<style> html, body { overflow-x: hidden } body { margin: 0; font: 18px Georgia, serif } .row { width: 1200px; height: 40px; background: #ddd } </style>
