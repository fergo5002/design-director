id = "penpot-mcp"
name = "Penpot MCP server (official)"
url = "https://help.penpot.app/mcp/"
kind = "mcp"
category = "mcp-design-tool"
best_for = "Open-source alternative to Figma where an agent can read and write the focused page - components, styles, tokens, layers - hosted or self-run"
cost = "free"
agent_access = "mcp"
agent_notes = "Official. Hosted: enable under Your account > Integrations > MCP Server, generate a key (shown once, one per user), URL https://design.penpot.app/mcp/stream?userToken=KEY, then File > MCP Server > Connect in an open file. Local: `npx @penpot/mcp@stable`, load plugin from http://localhost:4400/manifest.json, endpoint http://localhost:4401/mcp. Generic add: `npx -y add-mcp -g -n penpot <URL>`. Code now lives in penpot/penpot/mcp; the standalone penpot/penpot-mcp repo is archived."
