take = "The only mainstream design tool where the MCP is open source and self-hostable, so you can let an agent write freely without seat costs"
avoid = "Works in one browser tab at a time and dies if Chrome suspends the tab; Chromium may block design.penpot.app talking to localhost (use Firefox). Do not install the archived penpot/penpot-mcp repo"
licence = "MPL-2.0"
install = "npx @penpot/mcp@stable   # then: claude mcp add --transport http penpot http://localhost:4401/mcp"
freshness = "https://github.com/penpot/penpot/commits/develop/mcp.atom"
