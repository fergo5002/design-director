best_for = "Read-only Figma layout and style extraction that works on any Figma plan via a personal access token, trimmed down so it fits in context"
cost = "free"
agent_access = "mcp"
agent_notes = "Community, 16.1k stars, pushed 2026-10-27, MIT. stdio via npx. Claude Code: `claude mcp add framelink -- npx -y figma-developer-mcp --figma-api-key=YOUR-KEY --stdio`. Codex: [mcp_servers.framelink] command=\"npx\" args=[\"-y\",\"figma-developer-mcp\",\"--stdio\"] env={FIGMA_API_KEY=\"...\"}. Cursor: same command/args in .cursor/mcp.json. Needs a Figma PAT (figd_...)."
