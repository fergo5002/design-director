[[source]]
id = "figma-mcp-remote"
name = "Figma MCP server (official, remote)"
url = "https://developers.figma.com/docs/figma-mcp-server/"
kind = "mcp"
category = "mcp-design-tool"
best_for = "Pulling real frames, variables, components and Code Connect mappings out of Figma into code, and now writing native frames back to the canvas"
cost = "freemium"
price = "Usable on every plan but View/Collab seats get 20 tool calls a month; Professional Full/Dev seat 200/day, Enterprise 600/day. Write-to-canvas is beta and free 'for now', slated to become usage-based paid"
agent_access = "mcp"
agent_notes = "Remote endpoint https://mcp.figma.com/mcp, OAuth via /mcp in Claude Code. Codex CLI: `codex mcp add figma --url https://mcp.figma.com/mcp`. Cursor: `/add-plugin figma` or .cursor/mcp.json {\"mcpServers\":{\"figma\":{\"url\":\"https://mcp.figma.com/mcp\"}}}. Only clients in Figma's MCP catalogue may connect, others go on a waitlist. Desktop (local) server still exists for org/enterprise needs and needs a Dev or Full seat. Official, actively maintained (guide repo figma/mcp-server-guide pushed 2026-10-28)."
signal = 5
take = "Use get_design_context on a selected frame rather than screenshots; it carries real tokens, auto layout and Code Connect component names, so the agent reuses your design system instead of inventing values. Install the plugin route so Figma's own skills come along for the write tools"
avoid = "View/Collab seats are capped at 20 calls a month, which one session burns. Write-to-canvas will become a paid usage meter. Unlisted clients cannot connect at all"
install = "claude plugin install figma@claude-plugins-official   # or: claude mcp add --transport http figma https://mcp.figma.com/mcp"
freshness = "https://github.com/figma/mcp-server-guide/commits/main.atom"
verified = "2026-11-01"
evidence = "docs"

