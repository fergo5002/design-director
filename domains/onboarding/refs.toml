take = "Two details worth keeping: the 'Create Password' label (GOV.UK's wording), and a plain line under the phone field, 'It looks like you're in IRELAND based on your IP. Your data will be stored in the EU data center.'"
avoid = "Everything on one screen before any value: Full Name, Email, Create Password, Phone Number (with +353 country picker), a marketing opt-in checkbox and a Terms checkbox, then a full-width red 'GET STARTED'. The phone number is sales qualification on a self-serve trial, and the Terms checkbox is a second click that a one-line notice under the button would replace. On phone the form needs a scroll and the cookie bar hides the phone field and the button. A competitor-quote testimonial fills the left 28% of the desktop page"
tags = ["anti:phone-on-trial", "anti:terms-checkbox", "fields:4-plus-2-checkboxes"]
