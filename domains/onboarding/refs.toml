added = "2026-11-04"

[[ref]]
id = "runna-onboarding-growth-dives-teardown-r"
name = "Runna onboarding (Growth Dives teardown, Rosie Hoggmascall)"
url = "https://growth-dives.kit.com/posts/growth-dives-how-to-nail-onboarding-a-case-study-of-runna"
verdict = "exemplar"
angle = "direct"
evidence = "screenshot"
score = 3
seen = "2026-11-04"
take = "Setup questions answered with the user's own real world: pick your actual race from a searchable list ('Popular Races in the United Kingdom', each with date, distance and runner count), then a race card that says 'Half Marathon, 14 Sep 2025, Shoreham-by-Sea, Flat, 230 other Runnas' and 'an elevation gain of 34 meters'. A specific fact about the person's own goal reassures more than any slogan. Goal screen 'What is your goal?' lists nine concrete plans (Race, Run a first 5k, parkrun improvement plan, Postnatal plan) with a progress bar at the top and a close button"
avoid = "30 screens and about 12 minutes before the home screen, with birthday, gender and notifications asked before any value and a paywall near the end; the opening carousel carries Sign Up and Log In on every card, so account creation comes before the first useful moment; stock-feeling lifestyle photography of smiling runners on a bench"
tags = ["structure:real-object-in-setup", "copy:specific-facts", "anti:long-setup"]
shots = "domains/onboarding/shots/teardowns/2026-11-04T11-34-17"
notes = "Seen through the teardown's screenshots (rendered the article full page, desktop only, and read it in slices); the article shows a strip of all 30 screens too small to read, so I saw most steps but not every one, hence screenshot not flow"
status = "active"
added = "2026-11-04"

