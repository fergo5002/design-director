score = 5
seen = "2026-11-04"
take = "About ten dark screens, each one centred heading, one grey line and one action, no imagery: 'Welcome to Linear' / 'Get started'; 'Choose your style' (Light or Dark, 'Change your theme at any time via the command menu or settings'); 'Meet the command menu' with two large keycaps for the shortcut and 'Try opening the command menu with:'; 'Let's try it out' inside the real command menu; 'That was easy! Remember, use the shortcut to bring it up'; 'Join or create a team' as two tabs, existing teams listed with member counts and avatars and a 'Join' each; a GitHub workflow explainer; 'Invite co-workers to your team' with 'I'll do this later' under Continue; 'Subscribe to updates' with the changelog and marketing toggles shown off in the author's capture; 'You're good to go / When you're ready, create your first issue by pressing c' and 'Open Linear'. No confetti. Anyone with the company domain can join without an invite"
avoid = "Type is very small on the dark screens (the author had to zoom); asking for theme before anything useful is a taste call that only works because every other step is so light"
tags = ["flow:one-thing-per-screen", "copy:calm", "structure:join-vs-create", "structure:teach-by-doing", "defaults:marketing-off"]
shots = "domains/onboarding/shots/teardowns/2026-11-04T11-34-17"
notes = "Flow seen through the teardown's screenshots of every step (rendered the article full page and read each slice), not walked by me; the author joined an existing company workspace, so a brand-new workspace may differ"
