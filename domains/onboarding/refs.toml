[[ref]]
id = "luke-wroblewski-inline-validation-in-web"
name = "Luke Wroblewski: Inline validation in web forms (A List Apart, 2009)"
url = "https://alistapart.com/article/inline-validation-in-web-forms/"
verdict = "exemplar"
angle = "leader"
evidence = "visited"
score = 4
seen = "2026-11-04"
take = "Validate on blur ('after'), not while typing: best inline version against submit-and-reload gave success up 22%, errors down 22%, completion time down 42%, satisfaction up 31% (22 people, six registration forms). Messages before or while typing raised errors and annoyed people. Use while-typing, with a short delay, only for strict-format fields such as username and password rules. Keep success messages on screen, beside the field. Do not validate names and postcodes inline: only 30 to 50% noticed those messages, and a green tick reads as 'correct', not 'valid'"
avoid = "Small 2009 study, each person saw all six forms (learning effects), no raw counts published"
tags = ["validation:on-blur", "validation:persistent-success", "fields:password-rules"]
status = "active"
added = "2026-11-04"

