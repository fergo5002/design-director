[[ref]]
id = "gov-uk-design-system-create-accounts-and"
name = "GOV.UK Design System: Create accounts and Confirm an email address patterns"
url = "https://design-system.service.gov.uk/patterns/create-accounts/"
verdict = "exemplar"
angle = "leader"
evidence = "visited"
score = 5
seen = "2026-11-04"
take = "Only make an account when people 'will need to regularly access or update their data'; for one-off tasks give a reference number by email or text instead. Let users 'use as much of your service as possible before they need to create an account'. Say 'Create an account', not 'Register' or 'Sign up', and 'Create a password' rather than 'Password' so nobody thinks they are being asked for an existing one. No CAPTCHAs, no distracting links on the account screen, never ask for the same thing twice. Email confirmation: show the address it was sent to, let them resend to a different address, expire the link and say why when it has"
avoid = "Guidance pages, not a branded product, so they teach structure and copy, not visual language"
tags = ["copy:create-an-account", "structure:defer-account", "verification:email-loop"]
notes = "Read the Create accounts and Confirm an email address pattern pages"
status = "active"
added = "2026-11-04"

