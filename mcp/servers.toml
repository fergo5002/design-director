# Recommended MCP servers by tier, read by `ddr mcp`.
# core: free, every machine. recommended: free or freemium, big gains. optional: paid or specialist.
# Every entry is also in the catalogue (library/agent-tooling.toml) with evidence and dates.

[[server]]
id = "playwright"
name = "Playwright MCP (Microsoft)"
catalogue = "playwright-mcp"
claude = "claude mcp add playwright -- npx @playwright/mcp@latest"
codex = "[mcp_servers.playwright]\ncommand = \"npx\"\nargs = [\"@playwright/mcp@latest\"]"
cursor = "\"playwright\": { \"command\": \"npx\", \"args\": [\"@playwright/mcp@latest\"] }"
docs = "https://github.com/microsoft/playwright-mcp"
research = true
tier = "core"
why = "The agent opens its own page, clicks through flows and screenshots it at set viewport sizes."

[[server]]
id = "chrome-devtools"
name = "Chrome DevTools MCP (Google)"
catalogue = "chrome-devtools-mcp"
claude = "claude mcp add chrome-devtools -- npx -y chrome-devtools-mcp@latest --no-usage-statistics"
codex = "[mcp_servers.chrome-devtools]\ncommand = \"npx\"\nargs = [\"-y\", \"chrome-devtools-mcp@latest\", \"--no-usage-statistics\"]"
cursor = "\"chrome-devtools\": { \"command\": \"npx\", \"args\": [\"-y\", \"chrome-devtools-mcp@latest\", \"--no-usage-statistics\"] }"
docs = "https://github.com/ChromeDevTools/chrome-devtools-mcp"
needs = "Sends usage statistics and CrUX lookups by default; add --no-usage-statistics --no-performance-crux to switch off."
research = true
tier = "core"
why = "Performance traces, LCP and layout shift, console and network for the agent's own pages."

[[server]]
id = "context7"
name = "Context7"
catalogue = "context7"
claude = "claude mcp add --scope user context7 -- npx -y @upstash/context7-mcp"
codex = "[mcp_servers.context7]\nurl = \"https://mcp.context7.com/mcp\"\nstartup_timeout_sec = 40"
cursor = "\"context7\": { \"url\": \"https://mcp.context7.com/mcp\" }"
docs = "https://context7.com"
needs = "Free key from context7.com/dashboard raises rate limits."
tier = "core"
why = "Current docs for Tailwind v4, Motion, GSAP, shadcn, Three and the rest, so the agent stops writing last year's API."

[[server]]
id = "shadcn"
name = "shadcn MCP and registries"
catalogue = "shadcn-mcp"
claude = "npx shadcn@latest mcp init --client claude"
codex = "[mcp_servers.shadcn]\ncommand = \"npx\"\nargs = [\"shadcn@latest\", \"mcp\"]"
cursor = "\"shadcn\": { \"command\": \"npx\", \"args\": [\"shadcn@latest\", \"mcp\"] }"
docs = "https://ui.shadcn.com/docs/mcp"
tier = "core"
why = "Search and install components from shadcn and any shadcn-compatible registry by plain request. Check each registry's licence in the catalogue."

[[server]]
id = "exa"
name = "Exa MCP (official, remote)"
catalogue = "exa-mcp"
claude = "claude mcp add --transport http exa https://mcp.exa.ai/mcp"
codex = "codex mcp add exa --url https://mcp.exa.ai/mcp"
cursor = "\"exa\": { \"url\": \"https://mcp.exa.ai/mcp\" }"
docs = "https://github.com/exa-labs/exa-mcp-server"
needs = "Works without a key at low rate limits; sign in with OAuth for more. Add ?tools=web_search_advanced_exa for domain and date filters."
research = true
tier = "recommended"
why = "Search by description ('cottage rental sites with editorial photography and the calendar up front'), which is how design references are actually found."

[[server]]
id = "figma"
name = "Figma MCP (official, remote)"
catalogue = "figma-mcp-remote"
claude = "claude mcp add --transport http figma https://mcp.figma.com/mcp"
codex = "[mcp_servers.figma]\nurl = \"https://mcp.figma.com/mcp\""
cursor = "\"figma\": { \"url\": \"https://mcp.figma.com/mcp\" }"
docs = "https://developers.figma.com/docs/figma-mcp-server/"
needs = "Figma account. View and Collab seats get 20 calls a month; Dev or Full seats 200 a day. Write-to-canvas is free for now and slated to become usage-based."
tier = "recommended"
why = "Pull frames, variables and components out of Figma into code, and write frames back to the canvas (beta)."

[[server]]
id = "21st-dev"
name = "21st.dev Magic MCP"
catalogue = "21st-dev-mcp"
claude = "npx @21st-dev/cli@latest init --client claude"
codex = "npx @21st-dev/cli@latest init --client codex"
cursor = "npx @21st-dev/cli@latest init --client cursor"
docs = "https://github.com/21st-dev/magic-mcp"
needs = "Free API key from 21st.dev; generation tools need AI access on the account."
tier = "recommended"
why = "Search a large community component library and pull a component as code."

[[server]]
id = "firecrawl"
name = "Firecrawl MCP (branding format)"
catalogue = "firecrawl-mcp-branding"
claude = "claude mcp add --transport http firecrawl https://mcp.firecrawl.dev/v2/mcp"
codex = "[mcp_servers.firecrawl]\nurl = \"https://mcp.firecrawl.dev/v2/mcp\""
cursor = "\"firecrawl\": { \"url\": \"https://mcp.firecrawl.dev/v2/mcp\" }"
docs = "https://github.com/firecrawl/firecrawl-mcp-server"
needs = "Respect each site's terms; use it to study a reference, never to clone a brand."
research = true
tier = "recommended"
why = "Extract a reference site's colours, fonts, type scale, spacing and radius as JSON with formats [\"branding\"]. Keyless endpoint is rate-limited."

[[server]]
id = "storybook"
name = "Storybook MCP addon"
catalogue = "storybook-mcp"
claude = "claude mcp add --transport http storybook http://localhost:6006/mcp"
codex = "[mcp_servers.storybook]\nurl = \"http://localhost:6006/mcp\""
cursor = "\"storybook\": { \"url\": \"http://localhost:6006/mcp\" }"
docs = "https://storybook.js.org/docs/ai/mcp/overview"
needs = "Run `npx storybook add @storybook/addon-mcp` in the project; serves while Storybook dev runs. Preview API."
tier = "recommended"
why = "Per project: gives the agent your real components and stories, the best guard against one-off invented components."

[[server]]
id = "excalidraw"
name = "Excalidraw MCP App"
catalogue = "excalidraw-mcp-app"
claude = "claude mcp add --transport http excalidraw https://mcp.excalidraw.com"
codex = "[mcp_servers.excalidraw]\nurl = \"https://mcp.excalidraw.com\""
cursor = "\"excalidraw\": { \"url\": \"https://mcp.excalidraw.com\" }"
docs = "https://github.com/excalidraw/excalidraw-mcp"
tier = "recommended"
why = "Hand-drawn flows and wireframes as an editable canvas, for thinking before pixels."

[[server]]
id = "mobbin"
name = "Mobbin MCP (official)"
catalogue = "mobbin-mcp"
claude = "claude mcp add mobbin --scope user --transport http https://api.mobbin.com/mcp"
codex = "codex mcp add mobbin --url https://api.mobbin.com/mcp && codex mcp login mobbin"
cursor = "\"mobbin\": { \"url\": \"https://api.mobbin.com/mcp\" }"
docs = "https://docs.mobbin.com/mcp/introduction"
needs = "Mobbin Pro, Team or Enterprise. OAuth on first use. Avoid unofficial Mobbin MCPs that ask for your session credentials."
research = true
tier = "optional"
why = "Search real shipped app screens, flows and website sections; the single biggest upgrade for product UI work."

[[server]]
id = "refero"
name = "Refero MCP and refero-design skill"
catalogue = "refero-mcp-skill"
claude = "claude plugin marketplace add referodesign/refero_skill && claude plugin install refero@refero"
codex = "codex plugin marketplace add referodesign/refero_skill && codex plugin add refero@refero"
docs = "https://github.com/referodesign/refero_skill"
needs = "Paid Refero plan for live search."
research = true
tier = "optional"
why = "Research-first design: pulls real screens, flows and styles from Refero before building. The bundled craft references work without an account."

[[server]]
id = "framer"
name = "Framer MCP (official)"
catalogue = "framer-mcp"
claude = "claude mcp add --transport http framer https://mcp.framer.com/mcp"
codex = "[mcp_servers.framer]\nurl = \"https://mcp.framer.com/mcp\""
cursor = "\"framer\": { \"url\": \"https://mcp.framer.com/mcp\" }"
docs = "https://www.framer.com/mcp/"
