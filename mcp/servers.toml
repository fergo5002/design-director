claude = "claude mcp add --transport http penpot http://localhost:4401/mcp"
codex = "[mcp_servers.penpot]\nurl = \"http://localhost:4401/mcp\""
cursor = "\"penpot\": { \"url\": \"http://localhost:4401/mcp\" }"
